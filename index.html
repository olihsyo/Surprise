<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0712">
<title>একটা ছোট্ট সারপ্রাইজ ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Hind+Siliguri:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>

<main>
  <section id="intro" class="intro" aria-label="শুরু">
    <p class="intro-text" id="introText"></p>
    <button id="begin" class="begin" type="button">Tap to Begin</button>
  </section>

  <section id="card" class="card" aria-live="polite" hidden>
    <p class="spark" aria-hidden="true">✦</p>
    <h1 class="hello" id="hello" data-step></h1>
    <h2 class="name" id="name" data-step></h2>
    <p class="msg" id="msg" data-step></p>
    <figure class="photo" id="photoWrap" data-step>
      <img id="photo" alt="" decoding="async">
      <div class="placeholder" id="placeholder" hidden aria-hidden="true">♥</div>
    </figure>
    <p class="final" id="final" data-step></p>
  </section>
</main>

<div class="controls" id="controls" hidden>
  <button id="mute" class="icon-btn" type="button" aria-label="Mute music" aria-pressed="false">🔊</button>
  <button id="replay" class="icon-btn text" type="button">Replay ✨</button>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
